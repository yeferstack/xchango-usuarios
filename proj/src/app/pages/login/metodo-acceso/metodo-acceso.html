@if (abierto) {

  <!-- ================= OVERLAY ================= -->

  <div
    class="ma-overlay"
    (click)="onOverlayClick($event)"
  >

    <!-- ================= MODAL ================= -->

    <div
      class="ma-modal"
      role="dialog"
      aria-modal="true"
    >

      <!-- ================= CERRAR ================= -->

      <button
        class="ma-close"
        type="button"
        aria-label="Cerrar"
        (click)="cerrarModal()"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>

      </button>


      <!-- ================= LOGO ================= -->

      <div class="ma-logo">

        <img
          src="/Logo-xchango/chango.png"
          alt="Logo XchanGo"
          class="ma-logo__chango"
        >

        <img
          src="/Logo-xchango/letras-chango.png"
          alt="XchanGo"
          class="ma-logo__wordmark"
        >

      </div>


      <!-- ================= TÍTULOS ================= -->

      <h2 class="ma-titulo">
        {{ titulo }}
      </h2>

      <p class="ma-subtitulo">
        {{ subtitulo }}
      </p>


      <!-- ================= MÉTODOS ================= -->

      <div class="ma-metodos">

        <!-- ================= GOOGLE ================= -->

        <button
          class="ma-metodo"
          type="button"
          (click)="elegirGoogle()"
        >

          <span class="ma-metodo__icono">

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
            >
              <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.53 5.53 0 0 1-2.4 3.63v3.02h3.88c2.27-2.09 3.57-5.17 3.57-8.84Z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.94-2.9l-3.88-3.02c-1.08.72-2.45 1.15-4.06 1.15-3.12 0-5.77-2.11-6.72-4.94H1.27v3.11A11.99 11.99 0 0 0 12 24Z"/>
              <path fill="#FBBC05" d="M5.28 14.29A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.38-2.29V6.6H1.27A11.99 11.99 0 0 0 0 12c0 1.94.46 3.77 1.27 5.4l4.01-3.11Z"/>
              <path fill="#EA4335" d="M12 4.77c1.76 0 3.34.6 4.58 1.79l3.44-3.44C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.27 6.6l4.01 3.11C6.23 6.88 8.88 4.77 12 4.77Z"/>
            </svg>

          </span>

          <span class="ma-metodo__texto">
            Continuar con Google
          </span>

        </button>


        <!-- ================= APPLE ================= -->

        <button
          class="ma-metodo"
          type="button"
          (click)="elegirApple()"
        >

          <span class="ma-metodo__icono">

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="17"
              height="19"
              viewBox="0 0 814 1000"
              fill="#191714"
            >
              <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-163.9-39.5c-76.4 0-103.5 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 2.6.6 6.8 1.3 11 1.3 45.4 0 102.5-30.4 138.1-71.3z"/>
            </svg>

          </span>

          <span class="ma-metodo__texto">
            Continuar con Apple
          </span>

        </button>


        <!-- ================= DIVISOR ================= -->

        <div class="ma-divisor">
          <span>o</span>
        </div>


        <!-- ================= CORREO ================= -->

        <button
          class="ma-metodo ma-metodo--correo"
          type="button"
          (click)="elegirCorreo()"
        >

          <span class="ma-metodo__icono">

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#847A68"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>

          </span>

          <span class="ma-metodo__texto">
            Continuar con correo
          </span>

        </button>

      </div>


      <!-- ================= CAMBIO DE MODO ================= -->

      <p class="ma-cambio-modo">

        {{ textoCambioModo }}

        <button
          type="button"
          class="ma-cambio-modo__accion"
          (click)="toggleModo()"
        >
          {{ accionCambioModo }}
        </button>

      </p>

    </div>

  </div>

}
